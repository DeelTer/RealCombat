# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
# Minecraft version to build for, one of the files in the versions folder. Override with -Pmc=26.3
mc=26.2
# Fabric Properties, check https://modmuss50.me/fabric.html
loader_version=0.19.5
# Mod Properties
mod_version=0.3.0
maven_group=ru.deelter
archives_base_name=realcombat
# https://projectlombok.org/changelog
lombok_version=1.18.42
# the ChopChop jar to compile against (optional at runtime), the one of the same Minecraft version
chopchop_jar=../ChopChop/build/libs/chopchop-0.4.0+{mc}.jar
# the server plugin is built against this, https://repo.papermc.io
paper_api_version=1.21.4-R0.1-SNAPSHOT
